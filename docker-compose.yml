services:
  postgres:
    image: postgres:16-alpine
    container_name: portal-difal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal_difal
    ports:
      - "5432:5432"
    volumes:
      - portal_difal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal_difal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  portal_difal_pgdata:
